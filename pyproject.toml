[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dagflow"
version = "0.1.0"
description = "A lightweight, async-first task orchestration engine with retries, timeouts and caching."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshay Sonare" }]
keywords = ["dag", "workflow", "orchestration", "asyncio", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6"]

[project.scripts]
dagflow = "dagflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dagflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "--doctest-modules --ignore=src/dagflow/__main__.py"

[tool.coverage.run]
source = ["dagflow"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PT", "RET"]
ignore = ["PLR2004", "PLR0913", "PLR0915", "PLR0912", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0124", "B018"]
